name: Xcode - Build and Analyze

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-analyze:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build and analyze iOS app
        run: |
          xcodebuild \
            -project QuietReels.xcodeproj \
            -scheme QuietReels \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/QuietReelsDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build analyze
