name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next((d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")), ""))')
          if [ -z "$SIMULATOR_ID" ]; then
            echo 'No available iPhone simulator found.' >&2
            exit 1
          fi
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
      - name: Build and run XCTest on iPhone simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project QuietReels.xcodeproj \
            -scheme QuietReels \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath "$RUNNER_TEMP/QuietReelsDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/QuietReelsTests.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/ios-test.log"
      - name: Report test and build errors
        if: failure()
        run: |
          grep -E 'error:|TEST FAILED|BUILD FAILED' "$RUNNER_TEMP/ios-test.log" | head -30 | while IFS= read -r line; do
            echo "::error::$line"
          done || true
      - name: Upload XCTest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-test-results
          path: ${{ runner.temp }}/QuietReelsTests.xcresult
          if-no-files-found: ignore
