name: Unsigned IPA

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "1.2.0"

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project QuietReels.xcodeproj \
            -scheme QuietReels \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/QuietReelsDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/ipa-build.log"

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/QuietReelsDerivedData/Build/Products/Release-iphoneos/QuietReels.app"
          test -d "$APP"
          test -x "$APP/QuietReels"

          PACKAGE_ROOT="$RUNNER_TEMP/QuietReelsPackage"
          mkdir -p "$PACKAGE_ROOT/Payload"
          cp -R "$APP" "$PACKAGE_ROOT/Payload/QuietReels.app"

          cd "$PACKAGE_ROOT"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload \
            "$GITHUB_WORKSPACE/OfflineFeed-1.2.0-unsigned.ipa"
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 OfflineFeed-1.2.0-unsigned.ipa > OfflineFeed-1.2.0-unsigned.ipa.sha256

      - name: Verify packaged application
        run: |
          plutil -extract CFBundleIdentifier raw \
            "$RUNNER_TEMP/QuietReelsPackage/Payload/QuietReels.app/Info.plist"
          plutil -extract CFBundleSupportedPlatforms.0 raw \
            "$RUNNER_TEMP/QuietReelsPackage/Payload/QuietReels.app/Info.plist"
          test "$(plutil -extract CFBundleShortVersionString raw "$RUNNER_TEMP/QuietReelsPackage/Payload/QuietReels.app/Info.plist")" = "1.2.0"
          file "$RUNNER_TEMP/QuietReelsPackage/Payload/QuietReels.app/QuietReels"
          unzip -t OfflineFeed-1.2.0-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineFeed-1.2.0-unsigned-IPA
          path: |
            OfflineFeed-1.2.0-unsigned.ipa
            OfflineFeed-1.2.0-unsigned.ipa.sha256
          if-no-files-found: error

      - name: Publish release
        if: github.ref == 'refs/tags/1.2.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            OfflineFeed-1.2.0-unsigned.ipa \
            OfflineFeed-1.2.0-unsigned.ipa.sha256 \
            --title "1.2.0" \
            --notes "Offline Feed 1.2.0 adds creator account collections for authorized local video files. A username does not sign in or download posts. This IPA is unsigned and needs Apple signing before installation on a normal iPhone."

      - name: Remove superseded preview release
        if: github.ref == 'refs/tags/1.2.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/405440540"
